<style>
:root{--bg:#F4F4F1;--card:#fff;--fg:#111113;--muted:#6B6B70;--line:#E4E4E0;--accent:#2E5BFF;--err:#D23A4E}

input{width:100%;font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);outline:0}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);cursor:pointer}

const u8=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},key,u8(D.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
document.getElementById('f').addEventListener('submit',async(e)=>{
  e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err'),pw=document.getElementById('pw').value;
  if(!pw)return;b.disabled=true;b.textContent='Opening…';er.textContent='';
  try{const html=await open(pw);try{sessionStorage.setItem('modrn-pw',pw);}catch(x){}show(html);}
  catch(x){er.textContent='That password isn’t right.';b.disabled=false;b.textContent='Open';}
});
(async()=>{let s=null;try{s=sessionStorage.getItem('modrn-pw');}catch(x){}if(s){try{show(await open(s));}catch(x){}}})();
