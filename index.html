<style>
:root{--bg:#F4F4F1;--card:#fff;--fg:#111113;--muted:#6B6B70;--line:#E4E4E0;--accent:#2E5BFF;--err:#D23A4E}
@media (prefers-color-scheme:dark){:root{--bg:#1A1A19;--card:#232322;--fg:#F5F5F7;--muted:#A1A1A6;--line:#353533}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;letter-spacing:-.03em;margin-bottom:20px}
h1{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}p{margin:0 0 18px;color:var(--muted);font-size:14px}
input{width:100%;font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);outline:0}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:default}.err{color:var(--err);font-size:13px;min-height:20px;margin-top:8px}

const u8=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},key,u8(D.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
document.getElementById('f').addEventListener('submit',async(e)=>{
  e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err'),pw=document.getElementById('pw').value;
  if(!pw)return;b.disabled=true;b.textContent='Opening…';er.textContent='';
  try{const html=await open(pw);try{sessionStorage.setItem('modrn-pw',pw);}catch(x){}show(html);}
  catch(x){er.textContent='That password isn’t right.';b.disabled=false;b.textContent='Open';}
});
